# Family Locator settings. Copy to data/config.toml (not in git) and restart after editing.
# Every option and its default: docs/configuration.md. Settings marked (UI) can also be
# changed in the app, where they apply immediately.

port = 8790

# Optional "Apps" menu in the top bar, linking to your other apps (leave out for none):
# apps = [{ name = "Radio gateway", url = "http://192.0.2.10:8080/" },
#         { name = "Tesla", url = "http://192.0.2.10:9877/" }]

[tracking]
poll_seconds = 60         # (UI) read the positions Apple already has, this often
session_renew_minutes = 5   # (UI) fresh Find My session this often; family positions refresh per session
locate_minutes = 15       # (UI) default fresh-location interval per person; 0 = never, minimum 1
airtag_poll_minutes = 15  # (UI)

[alerts]
low_battery_pct = 15      # (UI) 0 = off
stale_hours = 12          # (UI) 0 = off
digest_hour = 20          # (UI) daily summary email at this local hour; -1 = off
quiet_from_hour = -1      # (UI) no alert emails from this hour...
quiet_to_hour = -1        # (UI) ...until this hour; -1 = off

[maps]
thunderforest_key = ""  # optional, free at thunderforest.com: adds the Thunderforest Transport base map

[links]
# Outside links in emails. Blank = use the radio gateway's Cloudflare quick tunnel,
# whose address is read from cloudflared each time.
public_url = ""
proxy_prefix = "/family/"
# With the radio gateway's TUNNEL_SHORT_LINKS on, emails also carry its short link
# (tinyurl.com/...) to this page, remade whenever the tunnel changes:
# short_links_file = "/tmp/cloudflare_tunnel_short.json"

[email]
# Gmail address + an app password (https://myaccount.google.com/apppasswords).
# On the gateway machine these match the radio gateway's EMAIL_* settings.
email_address = ""
email_app_password = ""
email_recipient = ""      # comma-separated; blank = email_address
